<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>〇×ゲーム</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app" aria-labelledby="title">
      <section class="game">
        <div class="celebration" id="celebration" aria-hidden="true"></div>

        <div class="game__header">
          <div>
            <p class="eyebrow">Tic Tac Toe</p>
            <h1 id="title">〇×ゲーム</h1>
          </div>
          <button class="reset-button" id="resetButton" type="button">次のゲーム</button>
        </div>

        <p class="status is-o-turn" id="status" aria-live="polite">67の番です（先攻）</p>

        <div class="board" id="board" role="grid" aria-label="〇×ゲームの盤面">
          <button class="cell" type="button" role="gridcell" aria-label="1行1列"></button>
          <button class="cell" type="button" role="gridcell" aria-label="1行2列"></button>
          <button class="cell" type="button" role="gridcell" aria-label="1行3列"></button>
          <button class="cell" type="button" role="gridcell" aria-label="2行1列"></button>
          <button class="cell" type="button" role="gridcell" aria-label="2行2列"></button>
          <button class="cell" type="button" role="gridcell" aria-label="2行3列"></button>
          <button class="cell" type="button" role="gridcell" aria-label="3行1列"></button>
          <button class="cell" type="button" role="gridcell" aria-label="3行2列"></button>
          <button class="cell" type="button" role="gridcell" aria-label="3行3列"></button>
        </div>

        <section class="records" aria-labelledby="recordsTitle">
          <div class="records__header">
            <h2 id="recordsTitle">戦績</h2>
            <button class="clear-button" id="clearRecordsButton" type="button">戦績クリア</button>
          </div>

          <dl class="scoreboard" aria-label="通算成績">
            <div class="score">
              <dt>67</dt>
              <dd id="circleWins">0</dd>
            </div>
            <div class="score">
              <dt>トントントンサフール</dt>
              <dd id="crossWins">0</dd>
            </div>
            <div class="score">
              <dt>引き分け</dt>
              <dd id="draws">0</dd>
            </div>
          </dl>

          <ol class="history" id="historyList" aria-label="過去の対戦履歴"></ol>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
